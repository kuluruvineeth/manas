[project]
name = "manas"
version = "0.1.0"
description = "A lightweight language model trained entirely from scratch"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kuluru Vineeth" }]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "jinja2>=3.1.6",
    "tokenizers>=0.23.2",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manas", "datapipe"]

[tool.ruff]
line-length = 120
src = ["manas", "datapipe"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
